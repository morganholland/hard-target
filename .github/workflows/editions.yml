name: Editions

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editions-${{ github.ref }}
  # Cancel superseded PR builds, but never a deploy that has started on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pandoc and fonts
        run: sudo apt-get update && sudo apt-get install -y pandoc poppler-utils fonts-inter fonts-dejavu-core libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install Python tools
        run: pip install weasyprint==70.0 pypdf==6.17.0 epubcheck==5.4.0
      - name: Build site, PDF, EPUB and Kindle EPUB
        run: python3 scripts/build_editions.py
      - name: Test every edition
        run: python3 scripts/test_editions.py
      - name: Keep the book files for KDP (the Kindle EPUB is not linked from the site)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: editions
          path: dist/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
